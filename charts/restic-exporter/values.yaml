image:
  repository: ghcr.io/josh/restic-exporter
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Each release monitors one repository; install the chart once per repository.
restic:
  # RESTIC_REPOSITORY. Leave empty when existingSecret provides it.
  repository: ""
  # Existing Secret whose keys are loaded as environment variables: RESTIC_PASSWORD
  # plus any backend credentials (AWS_*, B2_*, AZURE_*, ...). The chart never creates
  # Secrets; create it yourself (sealed-secrets, External Secrets, sops, kubectl, ...).
  existingSecret: ""
  ageIdentity:
    enabled: false
    existingSecret: "" # defaults to restic.existingSecret
    secretKey: RESTIC_AGE_IDENTITY
    mountPath: /run/secrets/restic-age-identity

exporter:
  refreshInterval: 3600
  includePaths: false
  verbose: false

extraEnv: []
extraEnvFrom: []

cache:
  path: /cache
  sizeLimit: ""
  volumeSource: {}

service:
  type: ClusterIP
  port: 9183

prometheusScrape: true

# Requires the Prometheus Operator CRDs. The instance label is set to the release
# name so several releases can share one dashboard. jobLabel names a Service label
# to use for the Prometheus job; empty uses the Operator's Service-name default.
serviceMonitor:
  enabled: false
  jobLabel: app.kubernetes.io/name
  interval: ""
  scrapeTimeout: ""
  labels: {}
  relabelings: []
  metricRelabelings: []

# Pod NetworkPolicies, split by direction so each can be enabled independently.
# Both are off by default. Enabling a direction makes it an allowlist.
networkPolicy:
  ingress:
    enabled: false
    # NetworkPolicyPeer entries allowed to scrape /metrics.
    from: []
  egress:
    enabled: false
    # NetworkPolicyPeer entries limiting where DNS may be sent. Empty leaves the
    # rule destination-agnostic.
    dnsTo: []
    # Egress to restic.repository. NetworkPolicy cannot resolve a URL, so name the
    # peers yourself; port must match the backend.
    repository:
      to: []
      port: 443
    # Complete NetworkPolicyEgressRule entries for any other destination.
    extraRules: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The repository index is held in memory, so usage grows with repository size.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

startupProbe:
  periodSeconds: 10
  failureThreshold: 60

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
